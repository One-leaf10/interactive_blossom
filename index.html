<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
html,body{margin:0;background:#060610;overflow:hidden;height:100%}
canvas{position:absolute;top:0;left:0;width:100%;height:100%}
#t{position:absolute;top:25px;width:100%;text-align:center;color:white;font-family:Arial;font-weight:300;letter-spacing:2px;font-size:22px;pointer-events:none}
#t b{color:#ff3b6e;font-weight:700}
</style>
</head>
<body>
<div id="t">Interactive <b>Blossom</b></div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'), x=c.getContext('2d');
let W,H; function R(){W=c.width=innerWidth; H=c.height=innerHeight} R(); addEventListener('resize',R);
let Fs=[];
class F{
 constructor(px,py){
  this.x=px; this.y=py; this.h=0; this.mh=90+Math.random()*140; this.g=0; this.b=0;
  this.s=0.8+Math.random()*0.5; this.c=`hsl(${340+Math.random()*20},100%,70%)`;
 }
 up(){ if(this.g<1){this.g+=0.015; this.h=this.mh*this.g*(2-this.g);} else if(this.b<1) this.b+=0.025; }
 draw(){
  x.save(); x.translate(this.x,this.y);
  x.strokeStyle='#ff4d7a'; x.lineWidth=2.5*this.s; x.shadowBlur=12; x.shadowColor='#ff2a6a';
  x.beginPath(); x.moveTo(0,0); x.bezierCurveTo(10,-this.h*0.3, -10,-this.h*0.6, 0,-this.h); x.stroke();
  x.shadowBlur=0;
  if(this.b>0){
   x.translate(0,-this.h); x.globalAlpha=this.b;
   for(let i=0;i<5;i++){
    x.rotate(Math.PI*2/5);
    x.fillStyle=this.c; x.shadowBlur=18; x.shadowColor=this.c;
    x.beginPath();
    // AQUI ESTA LO GRUESO: 19 de ancho x 15 de alto
    x.ellipse(0,8*this.s, 22*this.s, 15*this.s, 0,0,Math.PI*2);
    x.fill();
   }
   x.shadowBlur=0; x.fillStyle='#fff'; x.beginPath(); x.arc(0,0,5.5*this.s,0,Math.PI*2); x.fill();
  }
  x.restore();
 }
}
function add(X,Y){Fs.push(new F(X,Y))}
c.addEventListener('pointerdown',e=>add(e.clientX,e.clientY));
for(let i=0;i<4;i++) setTimeout(()=>add(W*0.2+Math.random()*W*0.6, H*0.8), i*200);
(function L(){ x.fillStyle='rgba(6,6,16,0.28)'; x.fillRect(0,0,W,H); Fs.forEach(f=>{f.up(); f.draw()}); requestAnimationFrame(L); })();
</script>
</body>
</html>
